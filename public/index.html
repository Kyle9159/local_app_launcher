<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dev Launcher</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2d3148;
    --text: #e2e8f0;
    --muted: #64748b;
    --running: #22c55e;
    --stopped: #475569;
    --radius: 12px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Title bar ────────────────────────────────── */
  .titlebar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    -webkit-app-region: drag;
    flex-shrink: 0;
  }
  .titlebar-icon { font-size: 20px; }
  .titlebar-title {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.3px;
  }
  .titlebar-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 1px;
  }
  .titlebar-right {
    margin-left: auto;
    display: flex;
    gap: 8px;
    -webkit-app-region: no-drag;
  }
  .btn-all {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-family: var(--font);
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-all:hover { background: #2d3250; }

  /* ── Main layout ──────────────────────────────── */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── App list ─────────────────────────────────── */
  .app-list {
    width: 300px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .app-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    position: relative;
    overflow: hidden;
  }
  .app-card:hover { background: var(--surface2); }
  .app-card.selected {
    border-color: var(--accent, #4ade80);
    background: var(--surface2);
  }
  .app-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent, transparent);
    border-radius: 3px 0 0 3px;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .app-card.selected::before { opacity: 1; }

  .app-card-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .app-icon {
    font-size: 22px;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface2);
    border-radius: 8px;
    flex-shrink: 0;
  }
  .app-info { flex: 1; min-width: 0; }
  .app-name {
    font-weight: 600;
    font-size: 13px;
    letter-spacing: -0.2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .app-desc {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--stopped);
    flex-shrink: 0;
    transition: background 0.3s;
    box-shadow: 0 0 0 0 transparent;
  }
  .status-dot.running {
    background: var(--running);
    box-shadow: 0 0 6px var(--running);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 6px var(--running); }
    50% { box-shadow: 0 0 12px var(--running); }
  }

  .app-card-actions {
    display: flex;
    gap: 6px;
  }
  .btn {
    border: none;
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 11px;
    font-weight: 500;
    font-family: var(--font);
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    white-space: nowrap;
  }
  .btn:active { transform: scale(0.96); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn-start {
    background: var(--accent, #4ade80);
    color: #0a0a0a;
    flex: 1;
  }
  .btn-stop {
    background: #ef4444;
    color: #fff;
    flex: 1;
  }
  .btn-open {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-start:hover:not(:disabled) { opacity: 0.9; }
  .btn-stop:hover:not(:disabled) { opacity: 0.9; }
  .btn-open:hover:not(:disabled) { background: #2d3250; }

  .port-badge {
    font-size: 10px;
    color: var(--muted);
    background: var(--surface2);
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid var(--border);
    margin-left: auto;
  }

  /* ── Detail panel ─────────────────────────────── */
  .detail {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .detail-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }
  .detail-icon {
    font-size: 28px;
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .detail-title {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.4px;
  }
  .detail-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .detail-status {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 6px;
    margin-top: 4px;
    display: inline-block;
    width: fit-content;
  }
  .detail-status.running { background: rgba(34,197,94,0.15); color: var(--running); }
  .detail-status.stopped { background: rgba(71,85,105,0.2); color: var(--muted); }

  .detail-actions {
    margin-left: auto;
    display: flex;
    gap: 8px;
  }
  .detail-actions .btn {
    padding: 8px 16px;
    font-size: 13px;
  }

  /* ── Log pane ─────────────────────────────────── */
  .log-header {
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .log-clear {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 11px;
    cursor: pointer;
    font-family: var(--font);
    padding: 2px 6px;
    border-radius: 4px;
    transition: background 0.1s;
  }
  .log-clear:hover { background: var(--surface2); color: var(--text); }

  .log-pane {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    font-family: "SF Mono", "Fira Code", "Fira Mono", Menlo, Consolas, monospace;
    font-size: 11.5px;
    line-height: 1.7;
    background: #0a0c14;
  }
  .log-pane::-webkit-scrollbar { width: 6px; }
  .log-pane::-webkit-scrollbar-track { background: transparent; }
  .log-pane::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .log-line { color: #94a3b8; }
  .log-line.err { color: #f87171; }
  .log-line.sys { color: #64748b; font-style: italic; }
  .log-line.cmd { color: #38bdf8; font-weight: 600; }

  /* ── Empty state ──────────────────────────────── */
  .empty-detail {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    gap: 8px;
  }
  .empty-detail-icon { font-size: 40px; opacity: 0.4; }
  .empty-detail-text { font-size: 13px; }

  /* ── Scrollbar (app list) ─────────────────────── */
  .app-list::-webkit-scrollbar { width: 4px; }
  .app-list::-webkit-scrollbar-track { background: transparent; }
  .app-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<div class="titlebar">
  <span class="titlebar-icon">🚀</span>
  <div>
    <div class="titlebar-title">Dev Launcher</div>
    <div class="titlebar-sub">Local app manager</div>
  </div>
  <div class="titlebar-right">
    <button class="btn-all" id="btn-stop-all">Stop All</button>
  </div>
</div>

<div class="main">
  <div class="app-list" id="app-list"></div>
  <div class="detail" id="detail">
    <div class="empty-detail">
      <div class="empty-detail-icon">⬅</div>
      <div class="empty-detail-text">Select an app to view logs</div>
    </div>
  </div>
</div>

<script>
let apps = [];
let selectedId = null;
let logStream = null;
let logEl = null;
let autoScroll = true;

// ── Fetch app list & render ──────────────────────────────────────────────────

async function loadApps() {
  try {
    const res = await fetch('/api/apps');
    apps = await res.json();
    renderList();
    if (selectedId) lightUpdateDetail(apps.find(a => a.id === selectedId));
  } catch (e) {
    console.error('Failed to load apps', e);
  }
}

// Update only status/buttons without destroying the log pane
function lightUpdateDetail(app) {
  if (!app) return;
  const statusEl = document.querySelector('.detail-status');
  if (statusEl) {
    statusEl.className = `detail-status ${app.running ? 'running' : 'stopped'}`;
    statusEl.textContent = (app.running ? '● Running' : '○ Stopped') + (app.port ? ` on :${app.port}` : '');
  }
  const actionBtn = document.getElementById('d-action');
  if (actionBtn) {
    if (app.running) {
      actionBtn.className = 'btn btn-stop';
      actionBtn.textContent = '■ Stop';
      actionBtn.onclick = () => stopApp(app.id);
    } else {
      actionBtn.className = 'btn btn-start';
      actionBtn.style.background = colorVar(app);
      actionBtn.textContent = '▶ Start';
      actionBtn.onclick = () => startApp(app.id);
    }
  }
  const openBtn = document.getElementById('d-open');
  if (openBtn) openBtn.disabled = !app.running;
}

function colorVar(app) {
  return app.color || '#4ade80';
}

function renderList() {
  const list = document.getElementById('app-list');
  list.innerHTML = '';
  for (const app of apps) {
    const card = document.createElement('div');
    card.className = 'app-card' + (app.id === selectedId ? ' selected' : '');
    card.style.setProperty('--accent', colorVar(app));
    card.dataset.id = app.id;
    card.innerHTML = `
      <div class="app-card-top">
        <div class="app-icon">${app.icon}</div>
        <div class="app-info">
          <div class="app-name">${app.name}</div>
          <div class="app-desc">${app.description}</div>
        </div>
        <div class="status-dot ${app.running ? 'running' : ''}"></div>
      </div>
      <div class="app-card-actions">
        ${app.running
          ? `<button class="btn btn-stop" data-id="${app.id}" data-action="stop">■ Stop</button>`
          : `<button class="btn btn-start" style="background:${colorVar(app)}" data-id="${app.id}" data-action="start">▶ Start</button>`
        }
        <button class="btn btn-open" data-id="${app.id}" data-action="open" ${!app.running ? 'disabled' : ''}>↗ Open</button>
        ${app.port ? `<span class="port-badge">:${app.port}</span>` : ''}
      </div>
    `;
    list.appendChild(card);
    card.addEventListener('click', (e) => {
      const action = e.target.dataset.action;
      if (action === 'start') { startApp(app.id); return; }
      if (action === 'stop') { stopApp(app.id); return; }
      if (action === 'open') { openApp(app); return; }
      selectApp(app.id);
    });
  }
}

// ── Select app → show detail + logs ─────────────────────────────────────────

function selectApp(id) {
  selectedId = id;
  renderList();
  const app = apps.find(a => a.id === id);
  updateDetail(app);
  subscribeToLogs(id);
}

function updateDetail(app) {
  if (!app) return;
  const detail = document.getElementById('detail');
  detail.innerHTML = `
    <div class="detail-header">
      <div class="detail-icon">${app.icon}</div>
      <div>
        <div class="detail-title" style="color:${colorVar(app)}">${app.name}</div>
        <div class="detail-desc">${app.description}</div>
        <div class="detail-status ${app.running ? 'running' : 'stopped'}">
          ${app.running ? '● Running' : '○ Stopped'}
          ${app.port ? ` on :${app.port}` : ''}
        </div>
      </div>
      <div class="detail-actions">
        ${app.running
          ? `<button class="btn btn-stop" id="d-action">■ Stop</button>`
          : `<button class="btn btn-start" id="d-action" style="background:${colorVar(app)}">▶ Start</button>`
        }
        <button class="btn btn-open" id="d-open" ${!app.running ? 'disabled' : ''}>↗ Open in Browser</button>
      </div>
    </div>
    <div class="log-header">
      <span>Logs</span>
      <button class="log-clear" id="log-clear">Clear</button>
    </div>
    <div class="log-pane" id="log-pane"></div>
  `;

  logEl = document.getElementById('log-pane');

  document.getElementById('d-action').addEventListener('click', () => {
    app.running ? stopApp(app.id) : startApp(app.id);
  });
  document.getElementById('d-open').addEventListener('click', () => openApp(app));
  document.getElementById('log-clear').addEventListener('click', () => {
    if (logEl) logEl.innerHTML = '';
  });

  logEl.addEventListener('scroll', () => {
    const el = logEl;
    autoScroll = el.scrollTop + el.clientHeight >= el.scrollHeight - 30;
  });
}

// ── Log streaming (SSE) ──────────────────────────────────────────────────────

function subscribeToLogs(id) {
  if (logStream) { logStream.close(); logStream = null; }
  logEl = document.getElementById('log-pane');
  if (!logEl) return;

  logStream = new EventSource(`/api/apps/${id}/logs/stream`);
  logStream.onmessage = (e) => {
    const { line } = JSON.parse(e.data);
    if (!logEl) return;
    const div = document.createElement('div');
    div.className = 'log-line' +
      (line.startsWith('[err]') ? ' err' : '') +
      (line.startsWith('▶') || line.startsWith('■') || line.startsWith('✖') ? ' cmd' : '');
    div.textContent = line;
    logEl.appendChild(div);
    if (autoScroll) logEl.scrollTop = logEl.scrollHeight;
  };
}

// ── Actions ──────────────────────────────────────────────────────────────────

async function startApp(id) {
  await fetch(`/api/apps/${id}/start`, { method: 'POST' });
  await loadApps();
  if (selectedId !== id) selectApp(id);
}

async function stopApp(id) {
  await fetch(`/api/apps/${id}/stop`, { method: 'POST' });
  await loadApps();
}

function openApp(app) {
  window.open(app.url, '_blank');
}

document.getElementById('btn-stop-all').addEventListener('click', async () => {
  const running = apps.filter(a => a.running);
  await Promise.all(running.map(a => fetch(`/api/apps/${a.id}/stop`, { method: 'POST' })));
  await loadApps();
});

// ── Poll for status changes ──────────────────────────────────────────────────

loadApps();
setInterval(loadApps, 3000);
</script>
</body>
</html>
